<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JeromeCV Pro — $9 Pro CV</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://js.stripe.com/v3/"></script> <!-- STRIPE -->
<style>
  :root{ --ink:#161b22; --paper:#f7f5f0; --paper-line:#ddd7c8; --brand:#33507a; --green:#2f8f7e; --font-body:'IBM Plex Sans', sans-serif; }
  *{box-sizing:border-box;} body{ font-family:var(--font-body); background:var(--ink); margin:0; }
.app{ max-width:1300px; margin:0 auto; background:var(--paper); min-height:100vh; }
.topbar{ display:flex; align-items:center; justify-content:space-between; padding:20px 40px; border-bottom:1px solid var(--paper-line); }
.btn{ font-weight:600; padding:12px 22px; border:1px solid; cursor:pointer; }
.btn-primary{ background:var(--ink); color:var(--paper); }
.btn-green{ background:var(--green); color:#fff; border-color:var(--green); }
.paywall{ background:#fffbe6; border:2px dashed #d4a017; padding:20px; text-align:center; margin:20px 0; }
.price{ font-size:28px; font-weight:700; color:var(--green); }
.workspace{ display:grid; grid-template-columns:420px 1fr; }
.panel-form{ padding:30px; border-right:1px solid var(--paper-line); max-height:calc(100vh - 73px); overflow-y:auto; }
.panel-preview{ background:#efece4; padding:30px; overflow-y:auto; }
.sheet{ background:#fff; padding:40px; min-height:760px; font-size:10.5px; }
.modal{ display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:999; align-items:center; justify-content:center; }
.modal-content{ background:#fff; padding:30px; width:90%; max-width:500px; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div><b>JeromeCV Pro</b></div>
    <div id="profileSwitcher"></div>
    <button class="btn btn-green" onclick="openModal('coverLetter')">Generate Cover Letter</button>
  </div>

  <div class="workspace">
    <div class="panel-form">
      <div class="paywall" id="paywall">
        <div class="price">$9</div>
        <b>Unlock Pro Download</b>
        <p>Download unlimited PDFs + Cover Letters for this CV</p>
        <button class="btn btn-primary" onclick="checkout()">Pay with Card</button>
        <p style="font-size:10px;">Powered by Stripe. Secure.</p>
      </div>

      <div><b>Basics</b></div><input id="fullName" placeholder="Full name" oninput="saveData();render()">
      <input id="roleTitle" placeholder="Target role" oninput="saveData();render()">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;"><input id="email" placeholder="Email" oninput="saveData();render()"><input id="phone" placeholder="Phone" oninput="saveData();render()"></div>
      <div><b>Summary</b></div><textarea id="summary" rows="3" oninput="saveData();render()"></textarea>
      <div><b>Experience</b></div><div id="experienceList"></div><button onclick="addExperience()">+ Add experience</button>
      <div><b>Education</b></div><div id="educationList"></div><button onclick="addEducation()">+ Add education</button>
      <div><b>Skills</b></div><input id="skillInput" placeholder="Press Enter" onkeydown="handleSkillEnter(event)"><div id="skillChips" style="display:flex; flex-wrap:wrap; gap:6px;"></div>
      <div style="margin-top:20px;"><button class="btn" onclick="newProfile()">+ New CV Profile</button>
      <button class="btn btn-primary" id="downloadBtn" style="float:right; display:none;" onclick="downloadPDF()">Download PDF ✓</button></div>
    </div>
    <div class="panel-preview"><div class="sheet" id="sheetLive"></div></div>
  </div>
</div>

<!-- COVER LETTER MODAL -->
<div class="modal" id="coverLetterModal">
  <div class="modal-content">
    <h3>AI Cover Letter</h3>
    <input id="companyName" placeholder="Company Name">
    <input id="jobTitle" placeholder="Job Title">
    <div id="generatedCL" style="border:1px solid #ccc; padding:15px; margin:15px 0; white-space:pre-line; max-height:300px; overflow:auto;"></div>
    <button class="btn btn-primary" onclick="generateCoverLetter()">Generate</button>
    <button class="btn" id="downloadCLBtn" style="display:none;" onclick="downloadCLPDF()">Download CL PDF</button>
    <button class="btn" onclick="closeModal()">Close</button>
  </div>
</div>

<script>
// 1. STRIPE SETUP - REPLACE WITH YOUR KEY
const stripe = Stripe('pk_test_51ABC...REPLACE_WITH_YOUR_KEY'); // Get from dashboard.stripe.com
let isPaid = localStorage.getItem('jeromecv_paid_' + currentProfile) === 'true';

const PRICING = { amount: 900, currency: 'usd', name: 'JeromeCV Pro Download' }; // $9.00

async function checkout(){
  // In production you need a backend. For now we use Stripe Checkout Link
  // Create a Payment Link in Stripe Dashboard and paste it here
  const PAYMENT_LINK = 'https://buy.stripe.com/test_REPLACE_ME'; // Create this in Stripe

  // After payment, Stripe redirects back. We simulate success:
  window.location.href = PAYMENT_LINK;
  // Real way: create a checkout session with your backend
}

// Call this when user returns from Stripe with?success=true
function checkPaymentStatus(){
  const urlParams = new URLSearchParams(window.location.search);
  if(urlParams.get('success') === 'true'){
    isPaid = true;
    localStorage.setItem('jeromecv_paid_' + currentProfile, 'true');
    unlockDownloads();
    alert('Payment successful! You can now download.');
  }
}

function unlockDownloads(){
  document.getElementById('paywall').style.display = 'none';
  document.getElementById('downloadBtn').style.display = 'block';
  document.getElementById('downloadCLBtn').style.display = 'block';
}

//... REST OF YOUR CODE FROM BEFORE...
let currentProfile = 'default';
let profiles = JSON.parse(localStorage.getItem('jeromecv_profiles') || '{"default":{}}');
let skills = []; let experiences = [{}]; let educations = [{}]; let photoData = null;

function newProfile(){ const name = prompt('Name this CV profile:'); if(!name) return; const id = name.toLowerCase().replace(/\s/g,'-'); profiles[id] = {}; saveAllProfiles(); switchProfile(id); }
function switchProfile(id){ currentProfile = id; isPaid = localStorage.getItem('jeromecv_paid_' + currentProfile) === 'true'; if(isPaid) unlockDownloads(); const data = profiles[id] || {}; fullName.value=data.name||''; roleTitle.value=data.role||''; email.value=data.email||''; phone.value=data.phone||''; summary.value=data.summary||''; skills=data.skills||[]; experiences=data.experiences||[{}]; educations=data.educations||[{}]; renderSwitcher(); renderRepeaters(); renderSkillChips(); render(); }
function renderSwitcher(){ profileSwitcher.innerHTML = Object.keys(profiles).map(id => `<button onclick="switchProfile('${id}')">${id}</button>`).join('') + `<button onclick="newProfile()">+ New</button>`; }
function saveData(){ profiles[currentProfile] = {name:fullName.value, role:roleTitle.value, email:email.value, phone:phone.value, summary:summary.value, skills, experiences, educations, photoData}; saveAllProfiles(); }
function saveAllProfiles(){ localStorage.setItem('jeromecv_profiles', JSON.stringify(profiles)); }
function addExperience(){ experiences.push({}); renderRepeaters(); }
function removeExperience(i){ experiences.splice(i,1); renderRepeaters(); saveData(); render(); }
function addEducation(){ educations.push({}); renderRepeaters(); }
function removeEducation(i){ educations.splice(i,1); renderRepeaters(); saveData(); render(); }
function renderRepeaters(){ experienceList.innerHTML = experiences.map((exp, i) => `<div><input placeholder="Role" value="${exp.title||''}" oninput="experiences[${i}].title=this.value; saveData(); render()"><input placeholder="Company" value="${exp.org||''}" oninput="experiences[${i}].org=this.value; saveData(); render()"><textarea placeholder="• Achievement" oninput="experiences[${i}].desc=this.value; saveData(); render()">${exp.desc||''}</textarea>${experiences.length>1?`<button onclick="removeExperience(${i})">x</button>`:''}</div>`).join(''); educationList.innerHTML = educations.map((edu, i) => `<div><input placeholder="Degree" value="${edu.title||''}" oninput="educations[${i}].title=this.value; saveData(); render()"><input placeholder="School" value="${edu.org||''}" oninput="educations[${i}].org=this.value; saveData(); render()">${educations.length>1?`<button onclick="removeEducation(${i})">x</button>`:''}</div>`).join(''); }
function handleSkillEnter(e){ if(e.key === 'Enter' && e.target.value.trim()){ skills.push(e.target.value.trim()); e.target.value = ''; renderSkillChips(); saveData(); render(); } }
function removeSkill(i){ skills.splice(i,1); renderSkillChips(); saveData(); render(); }
function renderSkillChips(){ skillChips.innerHTML = skills.map((s,i) => `<span>${s} <button onclick="removeSkill(${i})">x</button></span>`).join(''); }
function generateCoverLetter(){ const cl = `Dear ${companyName.value} Team,\n\nI am applying for ${jobTitle.value}. ${summary.value}\n\nSincerely,\n${fullName.value}`; generatedCL.textContent = cl; if(isPaid) downloadCLBtn.style.display='block'; else alert('Please pay $9 to download cover letter'); }
function downloadCLPDF(){ if(!isPaid) return alert('Pay first'); html2pdf().set({ margin: 0.6, filename: `CoverLetter.pdf`}).from(generatedCL).save(); }
function openModal(id){ document.getElementById(id+'Modal').style.display='flex'; }
function closeModal(){ document.querySelectorAll('.modal').forEach(m=>m.style.display='none'); }
function buildSheetHTML(){ return `<h1>${fullName.value||'YOUR NAME'}</h1><p>${roleTitle.value}</p><p>${summary.value}</p>`; }
function render(){ sheetLive.innerHTML = buildSheetHTML(); }
function downloadPDF(){ if(!isPaid) return alert('Pay $9 first'); html2pdf().set({ margin: 0.6, filename: `CV-${fullName.value}.pdf`}).from(sheetLive).save(); }

checkPaymentStatus(); // Check if returning from Stripe
renderSwitcher(); switchProfile(currentProfile);
</script>
</body>
</html>

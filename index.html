<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jerome's CV Maker - Pro CV Templates</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
  <header>
    <h1>Jerome's CV Maker</h1>
    <p>Build recruiter-approved CVs in 2 minutes</p>
  </header>

  <main>
    <!-- STEP 1 -->
    <section id="step1" class="screen active">
      <h2>1. Choose Your Job Type</h2>
      <div class="template-grid">
        <button class="template-card" data-type="tech">
          <h3>💻 Tech / CS</h3>
          <p>Clean, ATS-optimized. No photo. Skills + Projects first</p>
        </button>
        <button class="template-card" data-type="cabin">
          <h3>✈️ Cabin Crew / Hospitality</h3>
          <p>Professional with photo. Customer service focused</p>
        </button>
        <button class="template-card" data-type="corporate">
          <h3>🏦 Banking / Corporate</h3>
          <p>Formal, executive style. Education + Experience first</p>
        </button>
      </div>
    </section>

    <!-- STEP 2 -->
    <section id="step2" class="screen">
      <h2>2. Fill Your Details</h2>
      <form id="cvForm">
        <div class="form-grid">
          <input type="text" id="fullName" placeholder="Full Name" required>
          <input type="text" id="jobTitle" placeholder="Job Title" required>
          <input type="email" id="email" placeholder="Email">
          <input type="tel" id="phone" placeholder="Phone">
          <input type="text" id="location" placeholder="City, Country">
          <input type="url" id="linkedin" placeholder="LinkedIn URL">
        </div>

        <textarea id="summary" placeholder="Professional Summary - 3 to 4 lines about you" rows="4"></textarea>
        <textarea id="skills" placeholder="Key Skills - Separate with | e.g. Python | React | Project Management" rows="3"></textarea>
        <textarea id="experience" placeholder="Work Experience - Use this format: Job Title | Company | Date&#10;• Achievement 1&#10;• Achievement 2" rows="6"></textarea>
        <textarea id="education" placeholder="Education - Degree | University | Year" rows="3"></textarea>
        <textarea id="certs" placeholder="Certifications & Awards - Optional" rows="2"></textarea>

        <div id="photoUpload" class="hidden">
          <label><b>Upload Professional Photo</b></label>
          <input type="file" id="photo" accept="image/*">
          <img id="photoPreview" class="hidden">
        </div>

        <div class="btn-group">
          <button type="button" id="backBtn" class="btn-ghost">← Back</button>
          <button type="submit" class="btn-primary">Generate CV →</button>
        </div>
      </form>
    </section>

    <!-- STEP 3 -->
    <section id="step3" class="screen">
      <h2>3. Preview & Download</h2>
      <div id="cvPreview" class="cv-preview"></div>
      <div class="btn-group">
        <button id="editBtn" class="btn-ghost">← Edit Info</button>
        <button id="downloadPDF" class="btn-primary">Download PDF</button>
      </div>
    </section>
  </main>
  <script src="templates.js"></script>
  <script src="script.js"></script>
</body>
</html>
